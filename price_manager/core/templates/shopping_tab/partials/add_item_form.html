<form hx-post="{% url 'shopping-tab-item-add' tab.pk %}"
      hx-target="this"
      hx-swap="outerHTML"
      class="d-flex gap-2 align-items-start">
  {% csrf_token %}
  <div class="flex-grow-1">
    <input type="text" name="search_query" class="form-control form-control-sm{% if error %} is-invalid{% endif %}"
           placeholder="Название или артикул товара" value="{{ search_query|default:'' }}">
    {% if error %}
      <div class="invalid-feedback d-block">{{ error }}</div>
    {% endif %}
  </div>
  <input type="number" name="quantity" class="form-control form-control-sm" style="width: 6rem;"
         min="1" step="1" placeholder="Кол-во" value="{{ quantity|default:1 }}">
  <button type="submit" class="btn btn-primary btn-sm">
    <i class="bi bi-plus-lg"></i> Добавить
  </button>
</form>
{% if item_added %}
  <span id="cart-items-count" hx-swap-oob="true">{{ items_total }}</span>
  {% include 'shopping_tab/partials/tab_summary.html' %}
  {% include 'shopping_tab/partials/items_table.html' %}
{% endif %}
