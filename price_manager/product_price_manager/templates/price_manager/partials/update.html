
<div class="modal-header">
  <h5 class="modal-title fw-semibold">
    <i class="bi bi-pencil-square me-2 text-primary"></i>Редактирование наценки
    <span class="small fw-normal text-body-secondary ms-1">· {% if supplier %}{{ supplier.name }}{% else %}без поставщика{% endif %}</span>
  </h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
</div>
{% url "pricemanager-update" pricemanager.pk as rule_url %}
<form method="post"
      hx-post="{{ rule_url }}"
      hx-target="#modal-container .modal-content"
      hx-swap="innerHTML"
      enctype="multipart/form-data">
  {% csrf_token %}
  <div class="modal-body">
    {% include "price_manager/partials/pricemanager_form.html" with form=form refresh_url=rule_url|add:"?refresh=1" %}
  </div>
  <div class="modal-footer gap-2">
    <button
      type="submit"
      name="delete"
      value="true"
      class="btn btn-outline-danger me-auto"
      onclick="return confirm('Удалить эту наценку?')">
      <i class="bi bi-trash3 me-1"></i>Удалить
    </button>
    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
      Отмена
    </button>
    <button type="submit" class="btn btn-primary px-4">
      <i class="bi bi-floppy me-1"></i>Сохранить
    </button>
  </div>
</form>
