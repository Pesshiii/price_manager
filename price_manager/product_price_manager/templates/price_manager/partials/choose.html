{% comment %}
  «Добавить наценку» со страницы всех наценок — шаг 1: поставщик правила.
  От него зависят группы скидок, категории и источники цены в форме правила
  (PriceManagerCreate), поэтому он выбирается до неё. Пусто — «без поставщика».
{% endcomment %}
<div class="modal-header">
  <h5 class="modal-title fw-semibold">Новая наценка</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
</div>
<form hx-get="{% url 'price-manager-create' %}"
      hx-target="#modal-container .modal-content" hx-swap="innerHTML">
  <div class="modal-body">
    <label class="form-label small fw-medium" for="pm-choose-supplier">Поставщик</label>
    <select id="pm-choose-supplier" name="supplier" class="form-select" autofocus>
      <option value="">Без поставщика</option>
      {% for supplier in suppliers %}<option value="{{ supplier.pk }}">{{ supplier.name }}</option>{% endfor %}
    </select>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
    <button type="submit" class="btn btn-primary px-4">Далее</button>
  </div>
</form>
