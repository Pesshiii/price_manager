{% load crispy_forms_tags %}
<div class="modal-header">
  <h5 class="modal-title fw-semibold">{{ title }}</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
</div>
<form method="post"
      hx-post="{{ request.path }}"
      hx-target="#modal-container .modal-content"
      hx-swap="innerHTML">
  {% csrf_token %}
  <div class="modal-body">
    {{ form|crispy }}
  </div>
  <div class="modal-footer gap-2">
    {% if can_delete %}
      <button type="submit" name="delete" value="true" class="btn btn-outline-danger me-auto"
              onclick="return confirm('{{ delete_confirm }}')">
        <i class="bi bi-trash3 me-1" aria-hidden="true"></i>Удалить
      </button>
    {% endif %}
    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
    <button type="submit" class="btn btn-primary px-4">Сохранить</button>
  </div>
</form>
