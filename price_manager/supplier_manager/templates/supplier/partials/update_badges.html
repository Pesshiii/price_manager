{# Свежесть цен и остатков поставщика: badges = Supplier.update_badges(). #}
<div class="d-flex flex-wrap gap-1">
  {% for s in badges %}
    <span class="badge rounded-pill fw-normal supplier-status supplier-status-{{ s.status }}
                 {% if s.status == 'ok' %}bg-success-subtle text-success-emphasis
                 {% elif s.status == 'untracked' %}bg-secondary-subtle text-secondary-emphasis
                 {% else %}bg-danger-subtle text-danger-emphasis{% endif %}"
          title="{{ s.title }}">
      {% if s.status == 'ok' %}<i class="bi bi-check-circle-fill" aria-hidden="true"></i>
      {% elif s.status == 'untracked' %}<i class="bi bi-dash-circle" aria-hidden="true"></i>
      {% else %}<i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>{% endif %}
      {{ s.label }}
    </span>
  {% endfor %}
</div>
