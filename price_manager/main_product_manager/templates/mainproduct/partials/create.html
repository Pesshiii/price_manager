{% load crispy_forms_tags %}
<div class="container p-4">
    <h2 class="h4 mb-3">Новый товар</h2>
    <form hx-post="{% url 'mainproduct-create' %}"
          hx-target="#modal-container .modal-content"
          hx-swap="innerHTML"
          method="POST">
        {% csrf_token %}
        {{form|crispy}}
        {% if form.is_bound %}
          {% include "supplier/partials/category_filter_field.html" with field=form.categories %}
        {% else %}
          <div id="mainproduct-create-categories"
               hx-get="{% url 'mainproduct-create-categories' %}"
               hx-trigger="load"
               hx-swap="innerHTML"
               class="mb-3">
            <div class="text-muted small">Загрузка категорий...</div>
          </div>
        {% endif %}
        <div class="mt-4">
            <button class="btn btn-success">
                Добавить
            </button>
            <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">
                Отмена
            </button>
        </div>
    </form>
</div>
