services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price_manager_web
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me}
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-price_manager}
      POSTGRES_USER: ${POSTGRES_USER:-priceuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      OLLAMA_EMBED_URL: ${OLLAMA_EMBED_URL:-http://embedder:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_EMBED_TIMEOUT: ${OLLAMA_EMBED_TIMEOUT:-120}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./price_manager:/app
    command: >
      sh -c "python manage.py migrate && python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 price_manager.wsgi:application"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: price_manager_celery_worker
    restart: unless-stopped
    volumes:
      - ./price_manager:/app
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me}
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      POSTGRES_DB: ${POSTGRES_DB:-price_manager}
      POSTGRES_USER: ${POSTGRES_USER:-priceuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      OLLAMA_EMBED_URL: ${OLLAMA_EMBED_URL:-http://embedder:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_EMBED_TIMEOUT: ${OLLAMA_EMBED_TIMEOUT:-120}
    command: celery -A price_manager worker -l info