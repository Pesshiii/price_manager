name: ${PROJECT_NAME:-price_manager}

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-price_manager_db}
      POSTGRES_USER: ${POSTGRES_USER:-priceuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-priceuser} -d ${POSTGRES_DB:-price_manager_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1011:1011"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-only-set-SECRET_KEY-in-.env}
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: ${POSTGRES_DB:-price_manager_db}
      POSTGRES_USER: ${POSTGRES_USER:-priceuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      PIM_TOKEN: ${PIM_TOKEN:-dummy-token}
      PIM_HOST: ${PIM_HOST:-http://pim.invalid}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      HTTP_X_FORWARDED_PROTO: ${HTTP_X_FORWARDED_PROTO:-https}
      # Login with Bitrix24; empty = feature off. Secret lives in .env only.
      # web only on purpose: the worker never serves the login flow.
      BITRIX24_PORTAL: ${BITRIX24_PORTAL:-}
      BITRIX24_CLIENT_ID: ${BITRIX24_CLIENT_ID:-}
      BITRIX24_CLIENT_SECRET: ${BITRIX24_CLIENT_SECRET:-}
      BITRIX24_AUTO_CREATE_USERS: ${BITRIX24_AUTO_CREATE_USERS:-true}
      BITRIX24_LINK_REQUIRED: ${BITRIX24_LINK_REQUIRED:-false}
      # Only for the task links in the admin; the webhook is worker-only.
      BITRIX24_FEEDBACK_RESPONSIBLE_ID: ${BITRIX24_FEEDBACK_RESPONSIBLE_ID:-}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./price_manager:/app
    # --no-control-socket: gunicorn >=25.1 opens a `gunicornc` control socket
    # under $HOME/.gunicorn. Nothing here uses gunicornc, and the socket errors
    # out whenever HOME is not writable, so turn it off.
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 --no-control-socket price_manager.wsgi:application"

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1011:1011"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./price_manager:/app
    environment:
      # Must match `web` — sessions and signed values are shared between them.
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-only-set-SECRET_KEY-in-.env}
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: ${POSTGRES_DB:-price_manager_db}
      POSTGRES_USER: ${POSTGRES_USER:-priceuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      PIM_TOKEN: ${PIM_TOKEN:-dummy-token}
      PIM_HOST: ${PIM_HOST:-http://pim.invalid}
      # Feedback to developers as Bitrix24 tasks; empty = messages stay in the
      # admin only. Worker only: the web process never calls the webhook.
      BITRIX24_FEEDBACK_WEBHOOK: ${BITRIX24_FEEDBACK_WEBHOOK:-}
      BITRIX24_FEEDBACK_RESPONSIBLE_ID: ${BITRIX24_FEEDBACK_RESPONSIBLE_ID:-}
      # Price import guard (supplier_product_manager/guard.py), run by the
      # import task only. Defaults must match settings/project.py — an empty
      # value would fail float()/int() at startup. SHARE is a fraction, 0.05 = 5%.
      SUPPLIER_IMPORT_GUARD_RATIO: ${SUPPLIER_IMPORT_GUARD_RATIO:-0.7}
      SUPPLIER_IMPORT_GUARD_WINDOW: ${SUPPLIER_IMPORT_GUARD_WINDOW:-5}
      SUPPLIER_IMPORT_GUARD_MIN_HISTORY: ${SUPPLIER_IMPORT_GUARD_MIN_HISTORY:-3}
      SUPPLIER_IMPORT_GUARD_MISSING_LINKED_SHARE: ${SUPPLIER_IMPORT_GUARD_MISSING_LINKED_SHARE:-0.05}
      SUPPLIER_IMPORT_GUARD_MISSING_LINKED_MIN: ${SUPPLIER_IMPORT_GUARD_MISSING_LINKED_MIN:-10}
      # Cleanup tasks (settings/celery.py).
      SUPPLIER_FILES_KEEP_LAST: ${SUPPLIER_FILES_KEEP_LAST:-1}
      PERSISTENT_NOTIFICATION_TTL_HOURS: ${PERSISTENT_NOTIFICATION_TTL_HOURS:-72}
    command: celery -A price_manager worker -l info

  # Sends CELERY_BEAT_SCHEDULE (settings/celery.py) to the worker; runs nothing
  # itself. Exactly one per stack — two beats send every periodic task twice.
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "1011:1011"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./price_manager:/app
    environment:
      # Beat loads Django and autodiscovers tasks, so it needs the same boot
      # env as the worker (PIM_* included: pim_client validates them on import).
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-only-set-SECRET_KEY-in-.env}
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: ${POSTGRES_DB:-price_manager_db}
      POSTGRES_USER: ${POSTGRES_USER:-priceuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      PIM_TOKEN: ${PIM_TOKEN:-dummy-token}
      PIM_HOST: ${PIM_HOST:-http://pim.invalid}
      # Schedule intervals, beat only (settings/celery.py).
      CELERY_PRICE_UPDATE_MINUTES: ${CELERY_PRICE_UPDATE_MINUTES:-30}
      CELERY_STOCK_UPDATE_MINUTES: ${CELERY_STOCK_UPDATE_MINUTES:-15}
      CELERY_LOG_UPDATE_MINUTES: ${CELERY_LOG_UPDATE_MINUTES:-60}
      CELERY_SUPPLIER_FILES_CLEANUP_MINUTES: ${CELERY_SUPPLIER_FILES_CLEANUP_MINUTES:-30}
      CELERY_NOTIFICATION_CLEANUP_MINUTES: ${CELERY_NOTIFICATION_CLEANUP_MINUTES:-60}
    # Schedule state in /tmp, not the bind-mounted /app: it is disposable, and
    # uid 1011 may not be able to write the host tree.
    command: celery -A price_manager beat -l info -s /tmp/celerybeat-schedule

volumes:
  postgres_data:
  redis_data: